name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node scripts/verify-wp6-production-state.test.mjs
      - run: node scripts/verify-wp6-hosting-binding.test.mjs
      - run: node scripts/verify-wp6-app-portfolio.test.mjs
      - run: npm run build
